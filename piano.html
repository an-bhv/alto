<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Piano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 40px;
      gap: 24px;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: #666;
      text-transform: uppercase;
    }

    /* ── Display ── */
    #display {
      text-align: center;
      min-height: 72px;
    }

    #note-name {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      min-height: 1.2em;
    }

    #harmony-name {
      font-size: 1.1rem;
      color: #4a90d9;
      margin-top: 4px;
      min-height: 1.4em;
      letter-spacing: 0.04em;
    }

    /* ── Piano wrapper ── */
    #piano-wrapper {
      overflow-x: auto;
      max-width: 100%;
      padding: 4px 0 12px;
    }

    #piano {
      position: relative;
      height: 172px; /* white key height + label room */
    }

    /* ── Keys ── */
    .key {
      position: absolute;
      top: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 0 0 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.04s;
    }

    .key.white {
      background: linear-gradient(to bottom, #e8e8e8 0%, #f5f5f5 100%);
      border: 1px solid #bbb;
      height: 160px;
      z-index: 1;
    }
    .key.white:hover    { background: linear-gradient(to bottom, #dde8f5 0%, #eef4ff 100%); }
    .key.white.active   { background: #4a90d9 !important; }
    .key.white.scale-root { background: linear-gradient(to bottom, #2ecc71 0%, #58d68d 100%) !important; }
    .key.white.scale-note { background: linear-gradient(to bottom, #a9cce3 0%, #d4e9f7 100%) !important; }
    .key.white.active   { background: #4a90d9 !important; }

    .key.black {
      background: linear-gradient(to bottom, #222 0%, #1a1a1a 60%, #333 100%);
      border: 1px solid #000;
      height: 104px;
      z-index: 2;
    }
    .key.black:hover    { background: linear-gradient(to bottom, #3a3a3a 0%, #2a2a2a 100%); }
    .key.black.active   { background: #2471a3 !important; }
    .key.black.scale-root { background: linear-gradient(to bottom, #1a8c3a 0%, #239b56 100%) !important; }
    .key.black.scale-note { background: linear-gradient(to bottom, #1a4f6e 0%, #1f618d 100%) !important; }
    .key.black.active   { background: #2471a3 !important; }

    .key-kb {
      margin-top: auto;
      padding-bottom: 5px;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #999;
      line-height: 1;
    }
    .key.black .key-kb { color: #777; }

    .key-note {
      font-size: 0.5rem;
      color: #bbb;
      padding-bottom: 2px;
    }
    .key.black .key-note { display: none; }

    .degree-badge {
      position: absolute;
      top: 8px;
      font-size: 0.65rem;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      padding: 1px 3px;
      display: none;
      pointer-events: none;
      line-height: 1.2;
    }
    .scale-root .degree-badge,
    .scale-note .degree-badge { display: block; }
    .key.black .degree-badge { top: 6px; font-size: 0.55rem; }

    /* ── Controls ── */
    #controls {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ctrl-group label {
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    select, input[type="range"] {
      background: #252540;
      color: #eee;
      border: 1px solid #3a3a5c;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      min-width: 120px;
    }
    select:focus { outline: none; border-color: #4a90d9; }

    input[type="range"] {
      -webkit-appearance: none;
      padding: 0;
      height: 32px;
      min-width: 100px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #3a3a5c;
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4a90d9;
      margin-top: -6px;
    }

    /* ── Key guide ── */
    #key-guide {
      max-width: 660px;
      text-align: center;
      font-size: 0.72rem;
      color: #555;
      line-height: 2.2;
    }

    #key-guide .row { margin-bottom: 2px; }

    kbd {
      display: inline-block;
      background: #252540;
      border: 1px solid #3a3a5c;
      border-bottom: 2px solid #1a1a30;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #aaa;
      margin: 0 1px;
    }

    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.72rem;
      color: #666;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; }
    .sw-root { background: #2ecc71; }
    .sw-note { background: #a9cce3; }
  </style>
</head>
<body>

<h1>Keyboard Piano</h1>

<div id="display">
  <div id="note-name">—</div>
  <div id="harmony-name"></div>
</div>

<div id="piano-wrapper">
  <div id="piano"></div>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label for="scale-root">Scale Root</label>
    <select id="scale-root">
      <option value="">Off</option>
      <option value="0">C</option>
      <option value="1">C# / D♭</option>
      <option value="2">D</option>
      <option value="3">D# / E♭</option>
      <option value="4">E</option>
      <option value="5">F</option>
      <option value="6">F# / G♭</option>
      <option value="7">G</option>
      <option value="8">G# / A♭</option>
      <option value="9">A</option>
      <option value="10">A# / B♭</option>
      <option value="11">B</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label for="scale-type">Scale</label>
    <select id="scale-type">
      <option value="">—</option>
      <option>Major</option>
      <option>Natural Minor</option>
      <option>Harmonic Minor</option>
      <option>Pentatonic Major</option>
      <option>Pentatonic Minor</option>
      <option>Blues</option>
      <option>Dorian</option>
      <option>Phrygian</option>
      <option>Lydian</option>
      <option>Mixolydian</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label for="volume">Volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.65">
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="swatch sw-root"></div> Root note</div>
  <div class="legend-item"><div class="swatch sw-note"></div> Scale note</div>
</div>

<div id="key-guide">
  <div class="row">
    <strong style="color:#888">Lower octave C3–B3:</strong>
    white — <kbd>Z</kbd>C <kbd>X</kbd>D <kbd>C</kbd>E <kbd>V</kbd>F <kbd>B</kbd>G <kbd>N</kbd>A <kbd>M</kbd>B
    &nbsp;·&nbsp;
    black — <kbd>S</kbd>C# <kbd>D</kbd>D# <kbd>G</kbd>F# <kbd>H</kbd>G# <kbd>J</kbd>A#
  </div>
  <div class="row">
    <strong style="color:#888">Upper octave C4–C5:</strong>
    white — <kbd>Q</kbd>C <kbd>W</kbd>D <kbd>E</kbd>E <kbd>R</kbd>F <kbd>T</kbd>G <kbd>Y</kbd>A <kbd>U</kbd>B <kbd>I</kbd>C
    &nbsp;·&nbsp;
    black — <kbd>2</kbd>C# <kbd>3</kbd>D# <kbd>5</kbd>F# <kbd>6</kbd>G# <kbd>7</kbd>A#
  </div>
</div>

<script>
// ── Note data ───────────────────────────────────────────────────────────────
const KEYS = [
  { note:'C',  octave:3, midi:48, type:'white', kb:'z' },
  { note:'C#', octave:3, midi:49, type:'black', kb:'s' },
  { note:'D',  octave:3, midi:50, type:'white', kb:'x' },
  { note:'D#', octave:3, midi:51, type:'black', kb:'d' },
  { note:'E',  octave:3, midi:52, type:'white', kb:'c' },
  { note:'F',  octave:3, midi:53, type:'white', kb:'v' },
  { note:'F#', octave:3, midi:54, type:'black', kb:'g' },
  { note:'G',  octave:3, midi:55, type:'white', kb:'b' },
  { note:'G#', octave:3, midi:56, type:'black', kb:'h' },
  { note:'A',  octave:3, midi:57, type:'white', kb:'n' },
  { note:'A#', octave:3, midi:58, type:'black', kb:'j' },
  { note:'B',  octave:3, midi:59, type:'white', kb:'m' },
  { note:'C',  octave:4, midi:60, type:'white', kb:'q' },
  { note:'C#', octave:4, midi:61, type:'black', kb:'2' },
  { note:'D',  octave:4, midi:62, type:'white', kb:'w' },
  { note:'D#', octave:4, midi:63, type:'black', kb:'3' },
  { note:'E',  octave:4, midi:64, type:'white', kb:'e' },
  { note:'F',  octave:4, midi:65, type:'white', kb:'r' },
  { note:'F#', octave:4, midi:66, type:'black', kb:'5' },
  { note:'G',  octave:4, midi:67, type:'white', kb:'t' },
  { note:'G#', octave:4, midi:68, type:'black', kb:'6' },
  { note:'A',  octave:4, midi:69, type:'white', kb:'y' },
  { note:'A#', octave:4, midi:70, type:'black', kb:'7' },
  { note:'B',  octave:4, midi:71, type:'white', kb:'u' },
  { note:'C',  octave:5, midi:72, type:'white', kb:'i' },
];

const KB_MAP = {};
KEYS.forEach(k => { KB_MAP[k.kb] = k.midi; });

// ── Scales ───────────────────────────────────────────────────────────────────
const SCALES = {
  'Major':            [0,2,4,5,7,9,11],
  'Natural Minor':    [0,2,3,5,7,8,10],
  'Harmonic Minor':   [0,2,3,5,7,8,11],
  'Pentatonic Major': [0,2,4,7,9],
  'Pentatonic Minor': [0,3,5,7,10],
  'Blues':            [0,3,5,6,7,10],
  'Dorian':           [0,2,3,5,7,9,10],
  'Phrygian':         [0,1,3,5,7,8,10],
  'Lydian':           [0,2,4,6,7,9,11],
  'Mixolydian':       [0,2,4,5,7,9,10],
};

// ── Chords & intervals ────────────────────────────────────────────────────────
const CHORDS = {
  'Major':        [0,4,7],
  'Minor':        [0,3,7],
  'Dim':          [0,3,6],
  'Aug':          [0,4,8],
  'Sus2':         [0,2,7],
  'Sus4':         [0,5,7],
  'Dom 7':        [0,4,7,10],
  'Maj 7':        [0,4,7,11],
  'Min 7':        [0,3,7,10],
  'Dim 7':        [0,3,6,9],
  'Half-dim 7':   [0,3,6,10],
  'Dom 9':        [0,4,7,10,14],
  'Maj 9':        [0,4,7,11,14],
  'Min 9':        [0,3,7,10,14],
};

const INTERVALS = [
  'Unison','Minor 2nd','Major 2nd','Minor 3rd','Major 3rd',
  'Perfect 4th','Tritone','Perfect 5th','Minor 6th','Major 6th',
  'Minor 7th','Major 7th','Octave'
];

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx = null;
const activeNotes = new Map(); // midi -> { oscs, gain }
const pressedMidi = new Set();

function getCtx() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function getVol() { return parseFloat(document.getElementById('volume').value); }

function synthNote(midi) {
  const ctx = getCtx();
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const vol = getVol();
  const now = ctx.currentTime;

  const master = ctx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(vol * 0.55, now + 0.004);  // fast attack
  master.gain.setTargetAtTime(vol * 0.18, now + 0.004, 0.18);    // decay → sustain
  master.connect(ctx.destination);

  // Harmonics: slightly inharmonic for realism
  const oscs = [1, 2, 3, 4, 5, 6].map((h, i) => {
    const inh = 1 + 0.00012 * h * h;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * h * inh;
    const hg = ctx.createGain();
    hg.gain.value = [0.8, 0.28, 0.14, 0.07, 0.03, 0.015][i];
    osc.connect(hg).connect(master);
    osc.start(now);
    return osc;
  });

  // Soft key-click noise
  const nLen = Math.floor(ctx.sampleRate * 0.025);
  const nBuf = ctx.createBuffer(1, nLen, ctx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nLen; i++) nd[i] = (Math.random() * 2 - 1);
  const nSrc = ctx.createBufferSource();
  nSrc.buffer = nBuf;
  const nGain = ctx.createGain();
  nGain.gain.setValueAtTime(vol * 0.04, now);
  nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
  nSrc.connect(nGain).connect(master);
  nSrc.start(now);

  return { oscs, gain: master };
}

function noteOn(midi) {
  if (activeNotes.has(midi)) return;
  pressedMidi.add(midi);
  const snd = synthNote(midi);
  activeNotes.set(midi, snd);
  setKeyActive(midi, true);
  updateDisplay();
}

function noteOff(midi) {
  if (!pressedMidi.has(midi)) return;
  pressedMidi.delete(midi);

  const snd = activeNotes.get(midi);
  if (snd) {
    const ctx = getCtx();
    const now = ctx.currentTime;
    snd.gain.gain.cancelScheduledValues(now);
    snd.gain.gain.setValueAtTime(snd.gain.gain.value, now);
    snd.gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
    snd.oscs.forEach(o => o.stop(now + 1.3));
    activeNotes.delete(midi);
  }

  setKeyActive(midi, false);
  updateDisplay();
}

// ── Display ───────────────────────────────────────────────────────────────────
function updateDisplay() {
  const notes = [...pressedMidi].sort((a, b) => a - b);
  const nameEl = document.getElementById('note-name');
  const harmEl = document.getElementById('harmony-name');

  if (notes.length === 0) {
    nameEl.textContent = '—';
    harmEl.textContent = '';
    return;
  }

  const labels = notes.map(m => {
    const k = KEYS.find(k => k.midi === m);
    return k ? k.note + k.octave : '';
  });
  nameEl.textContent = labels.join('  +  ');

  if (notes.length === 2) {
    const interval = Math.abs(notes[1] - notes[0]);
    harmEl.textContent = INTERVALS[Math.min(interval, 12)] || '';
  } else if (notes.length >= 3) {
    harmEl.textContent = detectChord(notes) || '';
  } else {
    harmEl.textContent = '';
  }
}

function detectChord(midiNotes) {
  const sorted = [...midiNotes].sort((a, b) => a - b);
  // Try each note as potential root (handles inversions)
  for (let r = 0; r < sorted.length; r++) {
    const root = sorted[r] % 12;
    const intervals = sorted
      .map(m => ((m % 12) - root + 12) % 12)
      .sort((a, b) => a - b)
      .filter((v, i, a) => a.indexOf(v) === i); // unique

    for (const [name, pattern] of Object.entries(CHORDS)) {
      if (pattern.length === intervals.length &&
          pattern.every((v, i) => v === intervals[i])) {
        const rootName = NOTE_NAMES[root];
        const inv = r === 0 ? '' : ' (inv)';
        return `${rootName} ${name}${inv}`;
      }
    }
  }
  return null;
}

// ── Piano DOM ─────────────────────────────────────────────────────────────────
const WHITE_W = 44;
const BLACK_W = 28;

// X position (in white-key units) for each semitone within an octave
const NOTE_X = [0, 0.63, 1, 1.63, 2, 3, 3.63, 4, 4.63, 5, 5.63, 6];

function buildPiano() {
  const piano = document.getElementById('piano');
  let whiteIdx = 0;

  KEYS.forEach(key => {
    const el = document.createElement('div');
    el.className = `key ${key.type}`;
    el.dataset.midi = key.midi;

    const noteInOct = key.midi % 12;
    const octaveOffset = (key.octave - 3) * 7 * WHITE_W;

    if (key.type === 'white') {
      el.style.left  = (whiteIdx * WHITE_W) + 'px';
      el.style.width = WHITE_W + 'px';
      whiteIdx++;

      const noteEl = document.createElement('span');
      noteEl.className = 'key-note';
      noteEl.textContent = key.note + key.octave;
      el.appendChild(noteEl);
    } else {
      const x = octaveOffset + NOTE_X[noteInOct] * WHITE_W - BLACK_W / 2;
      el.style.left  = x + 'px';
      el.style.width = BLACK_W + 'px';
    }

    const kbEl = document.createElement('span');
    kbEl.className = 'key-kb';
    kbEl.textContent = key.kb.toUpperCase();
    el.appendChild(kbEl);

    const badge = document.createElement('span');
    badge.className = 'degree-badge';
    el.appendChild(badge);

    // Mouse / touch
    el.addEventListener('mousedown',  e => { e.preventDefault(); noteOn(key.midi); });
    el.addEventListener('mouseup',    () => noteOff(key.midi));
    el.addEventListener('mouseleave', () => { if (pressedMidi.has(key.midi)) noteOff(key.midi); });
    el.addEventListener('touchstart', e => { e.preventDefault(); noteOn(key.midi); }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); noteOff(key.midi); });
    el.addEventListener('touchcancel',() => noteOff(key.midi));

    piano.appendChild(el);
  });

  const totalWhite = KEYS.filter(k => k.type === 'white').length;
  piano.style.width = (totalWhite * WHITE_W) + 'px';
}

function setKeyActive(midi, on) {
  const el = document.querySelector(`[data-midi="${midi}"]`);
  if (!el) return;
  if (on) el.classList.add('active');
  else     el.classList.remove('active');
}

// ── Scale highlighting ────────────────────────────────────────────────────────
let scaleRoot = null;
let scaleType = null;

function applyScale() {
  // Clear all
  document.querySelectorAll('.key').forEach(el => {
    el.classList.remove('scale-root', 'scale-note');
    el.querySelector('.degree-badge').textContent = '';
    el.querySelector('.degree-badge').style.display = '';
  });

  if (scaleRoot === null || !scaleType) return;

  const intervals = SCALES[scaleType];
  if (!intervals) return;

  KEYS.forEach(key => {
    const semitones = ((key.midi % 12) - scaleRoot + 12) % 12;
    const el = document.querySelector(`[data-midi="${key.midi}"]`);
    if (!el) return;

    const degIdx = intervals.indexOf(semitones);
    if (semitones === 0) {
      el.classList.add('scale-root');
      el.querySelector('.degree-badge').textContent = '1';
    } else if (degIdx !== -1) {
      el.classList.add('scale-note');
      el.querySelector('.degree-badge').textContent = degIdx + 1;
    }
  });
}

document.getElementById('scale-root').addEventListener('change', e => {
  scaleRoot = e.target.value === '' ? null : parseInt(e.target.value, 10);
  applyScale();
});

document.getElementById('scale-type').addEventListener('change', e => {
  scaleType = e.target.value || null;
  applyScale();
});

// ── Keyboard input ────────────────────────────────────────────────────────────
const heldKb = new Set();

document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (heldKb.has(k)) return;
  heldKb.add(k);
  const midi = KB_MAP[k];
  if (midi !== undefined) noteOn(midi);
});

document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  heldKb.delete(k);
  const midi = KB_MAP[k];
  if (midi !== undefined) noteOff(midi);
});

// ── Init ──────────────────────────────────────────────────────────────────────
buildPiano();
</script>
</body>
</html>
