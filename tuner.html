<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saxophone Tuner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      color: #888;
      text-transform: uppercase;
    }

    /* Note display */
    #note-display {
      text-align: center;
    }

    #note-name {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      transition: color 0.15s;
      min-width: 160px;
      display: inline-block;
    }

    #octave {
      font-size: 2.5rem;
      vertical-align: super;
      color: #aaa;
    }

    #frequency {
      font-size: 1.1rem;
      color: #888;
      margin-top: 8px;
      letter-spacing: 0.05em;
    }

    /* Cents meter */
    #meter-container {
      width: 340px;
    }

    #meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    #meter-track {
      position: relative;
      height: 20px;
      background: #2d2d4e;
      border-radius: 10px;
      overflow: hidden;
    }

    #meter-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 10px;
      transition: left 0.08s ease-out, width 0.08s ease-out, background 0.15s;
    }

    #meter-center {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: #fff;
      transform: translateX(-50%);
    }

    #cents-value {
      text-align: center;
      margin-top: 10px;
      font-size: 1rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }

    /* In tune indicator */
    #in-tune {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      height: 1.4em;
      transition: opacity 0.2s;
    }

    /* Start button */
    #start-btn {
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #357ab8; }
    #start-btn.active { background: #c0392b; }

    #status {
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
    }

    /* Tuning reference */
    #reference {
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Saxophone Tuner</h1>

  <div id="note-display">
    <div>
      <span id="note-name">—</span><span id="octave"></span>
    </div>
    <div id="frequency">— Hz</div>
  </div>

  <div id="meter-container">
    <div id="meter-labels">
      <span>♭ flat</span>
      <span>in tune</span>
      <span>sharp ♯</span>
    </div>
    <div id="meter-track">
      <div id="meter-fill"></div>
      <div id="meter-center"></div>
    </div>
    <div id="cents-value">0 ¢</div>
  </div>

  <div id="in-tune"></div>

  <button id="start-btn">Start Listening</button>
  <div id="status">Press the button and allow microphone access</div>
  <div id="reference">Reference: A4 = 440 Hz</div>

<script>
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const IN_TUNE_THRESHOLD = 10; // cents

  let audioCtx = null;
  let analyser = null;
  let source = null;
  let running = false;
  let animFrame = null;
  let silenceTimer = null;

  const noteNameEl = document.getElementById('note-name');
  const octaveEl = document.getElementById('octave');
  const freqEl = document.getElementById('frequency');
  const meterFill = document.getElementById('meter-fill');
  const centsEl = document.getElementById('cents-value');
  const inTuneEl = document.getElementById('in-tune');
  const startBtn = document.getElementById('start-btn');
  const statusEl = document.getElementById('status');

  // Autocorrelation-based pitch detection (McLeod Pitch Method lite)
  function detectPitch(buffer, sampleRate) {
    const SIZE = buffer.length;
    const MAX_SAMPLES = Math.floor(SIZE / 2);
    const correlations = new Float32Array(MAX_SAMPLES);

    // Autocorrelation
    for (let i = 0; i < MAX_SAMPLES; i++) {
      let sum = 0;
      for (let j = 0; j < MAX_SAMPLES; j++) {
        sum += buffer[j] * buffer[j + i];
      }
      correlations[i] = sum;
    }

    // Find the first dip below zero (past the initial peak)
    let d = 0;
    while (d < MAX_SAMPLES && correlations[d] > 0) d++;

    // Find the next peak after the dip
    let maxVal = -Infinity;
    let maxPos = -1;
    for (let i = d; i < MAX_SAMPLES; i++) {
      if (correlations[i] > maxVal) {
        maxVal = correlations[i];
        maxPos = i;
      }
    }

    if (maxPos === -1 || maxVal < 0.01) return -1;

    // Parabolic interpolation for sub-sample accuracy
    let t0 = maxPos;
    if (t0 > 0 && t0 < MAX_SAMPLES - 1) {
      const x1 = correlations[t0 - 1];
      const x2 = correlations[t0];
      const x3 = correlations[t0 + 1];
      const denom = 2 * (2 * x2 - x1 - x3);
      if (denom !== 0) t0 += (x3 - x1) / denom;
    }

    return sampleRate / t0;
  }

  // Check signal level (RMS)
  function getRMS(buffer) {
    let sum = 0;
    for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
    return Math.sqrt(sum / buffer.length);
  }

  // Convert frequency to note + cents
  function freqToNote(freq) {
    const midi = 12 * Math.log2(freq / 440) + 69;
    const noteIndex = Math.round(midi);
    const cents = Math.round((midi - noteIndex) * 100);
    const name = NOTE_NAMES[((noteIndex % 12) + 12) % 12];
    const octave = Math.floor(noteIndex / 12) - 1;
    return { name, octave, cents };
  }

  function setIdle() {
    noteNameEl.textContent = '—';
    octaveEl.textContent = '';
    freqEl.textContent = '— Hz';
    meterFill.style.width = '0%';
    meterFill.style.left = '50%';
    centsEl.textContent = '0 ¢';
    inTuneEl.textContent = '';
    noteNameEl.style.color = '#fff';
  }

  function updateUI(freq, note) {
    noteNameEl.textContent = note.name;
    octaveEl.textContent = note.octave;
    freqEl.textContent = freq.toFixed(1) + ' Hz';

    const cents = note.cents;
    const clampedCents = Math.max(-50, Math.min(50, cents));
    // meter: 50% = center, range ±50 cents → 0–100%
    const pct = 50 + clampedCents; // 0–100
    const fillStart = Math.min(50, pct);
    const fillWidth = Math.abs(pct - 50);

    meterFill.style.left = fillStart + '%';
    meterFill.style.width = fillWidth + '%';

    const absCents = Math.abs(cents);
    if (absCents <= IN_TUNE_THRESHOLD) {
      meterFill.style.background = '#27ae60';
      noteNameEl.style.color = '#2ecc71';
      inTuneEl.style.color = '#2ecc71';
      inTuneEl.textContent = 'IN TUNE';
    } else if (absCents <= 25) {
      meterFill.style.background = '#f39c12';
      noteNameEl.style.color = '#f1c40f';
      inTuneEl.style.color = '#f1c40f';
      inTuneEl.textContent = cents < 0 ? 'FLAT' : 'SHARP';
    } else {
      meterFill.style.background = '#e74c3c';
      noteNameEl.style.color = '#e74c3c';
      inTuneEl.style.color = '#e74c3c';
      inTuneEl.textContent = cents < 0 ? 'TOO FLAT' : 'TOO SHARP';
    }

    const sign = cents > 0 ? '+' : '';
    centsEl.textContent = sign + cents + ' ¢';
  }

  const BUFFER_SIZE = 2048;
  const buffer = new Float32Array(BUFFER_SIZE);

  function loop() {
    if (!running) return;
    animFrame = requestAnimationFrame(loop);

    analyser.getFloatTimeDomainData(buffer);

    const rms = getRMS(buffer);
    if (rms < 0.01) {
      // Silence — clear after short delay
      if (!silenceTimer) {
        silenceTimer = setTimeout(setIdle, 300);
      }
      return;
    }

    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }

    const freq = detectPitch(buffer, audioCtx.sampleRate);
    // Saxophone range: roughly Bb2 (116 Hz) to F#6 (1480 Hz)
    if (freq < 60 || freq > 1500) return;

    const note = freqToNote(freq);
    updateUI(freq, note);
  }

  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = BUFFER_SIZE * 2;
      analyser.smoothingTimeConstant = 0;

      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      running = true;
      startBtn.textContent = 'Stop';
      startBtn.classList.add('active');
      statusEl.textContent = 'Listening... play a note!';
      loop();
    } catch (err) {
      statusEl.textContent = 'Microphone access denied: ' + err.message;
    }
  }

  function stop() {
    running = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    if (silenceTimer) clearTimeout(silenceTimer);
    if (source) source.disconnect();
    if (audioCtx) audioCtx.close();
    audioCtx = analyser = source = null;
    startBtn.textContent = 'Start Listening';
    startBtn.classList.remove('active');
    statusEl.textContent = 'Stopped.';
    setIdle();
  }

  startBtn.addEventListener('click', () => {
    if (running) stop(); else start();
  });
</script>
</body>
</html>
